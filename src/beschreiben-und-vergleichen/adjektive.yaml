# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Der blaue Anhänger: Adjektive"
description: "Sophie beschriftet ein Foto der Ausstellung. Du lernst, wo das Adjektiv steht: vor dem Nomen und nach be."
competencies: [adjektive]
scope: Die Seite führt das Adjektiv ein. Ein Adjektiv beschreibt ein Ding oder eine Person und ist der blaue Adjektiv-Anhänger. Er steht vor dem Nomen (a big house) oder nach be (The house is big). Er bekommt nie ein -s (two big houses). Nicht hier, weil es spätere Seiten sind. Steigerung, Vergleiche, Adverbien und Adjektive nach anderen Verben als be.
blocks:
  - type: section
    id: einstieg
    title: Eine Karte für das Foto
    blocks:
      - type: figure
        image: images/szene-adjektive.svg
        alt: Zwei Fotos hängen an der Wand im Flur der Millbrook School, eins zeigt einen Baum, eins ein Haus. Vor der Wand stehen vier Kinder.
        caption: "Von links: Ellie (roter Pferdeschwanz), Amir (Brille), Peter (gelbe Jacke) und Sophie (Zöpfe)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Mr Hill baut im Flur der Millbrook School die Ausstellung **Our Millbrook** auf (exhibition = Ausstellung). Die Klasse hängt Fotos und Karten an die Wand. Auf zwei Fotos sind ein Baum (tree) und ein Haus (house) zu sehen. Der Baum ist groß, das englische Wort dafür ist **big**. Sophie (mit den Zöpfen) schreibt die Karte für den Baum.
      - type: single-choice
        id: adjektive-start
        text: Sophie schreibt eine Karte für das Foto vom Baum. Welche Karte passt?
        options:
          - text: a big tree
            correct: true
            info: Das Wort big sagt, wie der Baum ist. Es steht vor dem Nomen tree.
          - text: a tree big
            correct: false
            info: Das Wort big steht im Englischen vor dem Nomen tree, nicht dahinter.
          - text: a bigs tree
            correct: false
            info: Das Wort big bekommt kein -s. Es sieht immer gleich aus.
        explanation: Das Wort big beschreibt den Baum und steht vor ihm.
        links:
          - title: Lernlandkarte Englisch · Stellung der Adjektive
            url: https://lernapps.net/apps/map/englisch/c/adjektive/
      - type: text
        text: "**Das kannst du danach:** Du beschreibst Dinge und Personen mit Adjektiven und weißt, wo das Adjektiv im Satz steht."
  - type: section
    id: neu
    title: Der Adjektiv-Anhänger
    blocks:
      - type: text
        text: "Ein **Nomen** ist das Wort für ein Ding oder eine Person, zum Beispiel house oder Peter. Ein **Adjektiv** (adjective) sagt, wie ein Ding oder eine Person ist: groß, alt, neu. Mr Hill gibt jedem Kind blaue Anhänger. Das ist der **Adjektiv-Anhänger**. Du kennst be schon (am, is, are). Der Anhänger hängt an zwei Plätzen."
      - type: figure
        image: images/anhaenger-adjektive.svg
        alt: Zwei Kartenreihen. In der ersten stehen die Karten a und house, dazwischen hängt ein blauer Anhänger mit dem Wort big. In der zweiten stehen The house und is, rechts davon hängt ein blauer Anhänger mit dem Wort big.
        caption: Der blaue Anhänger hängt vor dem Nomen oder nach is.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Der Adjektiv-Anhänger
        header: [Platz, Beispiel]
        rows:
          - [vor dem Nomen, a long table]
          - [nach be, The table is long.]
          - [Mehrzahl, two long tables]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Der Anhänger hängt **vor dem Nomen** oder **nach be**. Er verändert sich nie: Auch bei mehreren Dingen bekommt er **kein -s** (two long tables, nicht two longs tables).
      - type: table
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        header: [Ausdruck, Bedeutung]
        rows:
          - [big, groß]
          - [small, klein]
          - [old, alt]
          - [new, neu]
          - [tall, hoch (Bäume) / groß gewachsen (Menschen)]
          - [long, lang]
          - [tree, Baum]
          - [house, Haus]
          - [garden, Garten]
          - [rabbit, Kaninchen]
          - [hamster, Hamster]
          - [jacket, Jacke]
          - [bike, Fahrrad]
          - [table, Tisch]
          - ["has got / have got", "hat / haben (bei he, she, it: has got)"]
          - [a, ein / eine]
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: language-task
        id: adjektive-platz
        languages: { source: de, target: en }
        mode: choice
        task: Wähle die richtige Stelle für das Adjektiv.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Peter hat ein kleines Kaninchen.
            target: Peter has got a [small rabbit].
            distractors: [[rabbit small, smalls rabbit]]
          - cue: Amir hat eine neue Jacke.
            target: Amir has got a [new jacket].
            distractors: [[jacket new, news jacket]]
          - cue: Das Haus ist alt.
            target: The house [is old].
            distractors: [[old, are old]]
          - cue: Die Fahrräder sind neu.
            target: The bikes [are new].
            distractors: [[new, are news]]
        hint: Schau auf das Nomen und auf be im Satz. Wo hängt der blaue Anhänger?
      - type: ordering
        id: adjektive-reihe
        text: Bringe die Teile in die richtige Reihenfolge, sodass ein Satz entsteht.
        items:
          - Sophie
          - has got
          - a
          - big
          - garden
        explanation: Der Anhänger big hängt zwischen a und garden, also vor dem Nomen.
        links:
          - title: Lernlandkarte Englisch · Stellung der Adjektive
            url: https://lernapps.net/apps/map/englisch/c/adjektive/
      - type: language-task
        id: adjektive-bilden
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz.
        form: { case: hint, punctuation: ok }
        items:
          - cue: the garden · be · big
            target: The garden is big.
            accepted: [The garden's big.]
            mistakes:
              - answer: The garden big.
                message: Nach dem Nomen kommt erst be, dann der Anhänger. Dir fehlt is.
              - answer: The garden are big.
                message: Zu garden (ein Garten) gehört is, nicht are.
          - cue: Peter · have got · a · hamster · small
            target: Peter has got a small hamster.
            accepted: [Peter has a small hamster., Peter's got a small hamster.]
            mistakes:
              - answer: Peter have got a small hamster.
                message: Zu Peter (he) gehört has got, nicht have got.
              - answer: Peter has got a hamster small.
                message: Der Anhänger hängt vor dem Nomen, nicht dahinter.
              - answer: Peter has got a smalls hamster.
                message: Der Anhänger bekommt nie ein -s.
          - cue: they · be · two · tall · trees
            target: They are two tall trees.
            accepted: [They're two tall trees.]
            mistakes:
              - answer: They are two talls trees.
                message: Das -s gehört an das Nomen (trees), nicht an den Anhänger. Der Anhänger bleibt gleich.
              - answer: They are two trees tall.
                message: Der Anhänger hängt vor dem Nomen.
        hint: Frage dich, welches Wort das Nomen ist. Der blaue Anhänger hängt davor.
      - type: language-task
        id: adjektive-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz steckt ein Fehler. Schreibe den Satz richtig.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ellie has got a jacket new.
            target: Ellie has got a new jacket.
            mistakes:
              - answer: Ellie has got a jacket new.
                message: Noch nicht ganz. Wo hängt der blaue Anhänger, wenn ein Nomen da ist?
              - answer: Ellie has got a news jacket.
                message: Der Anhänger new bekommt nie ein -s.
          - cue: The houses are olds.
            target: The houses are old.
            mistakes:
              - answer: The houses are olds.
                message: Noch nicht ganz. Bekommt der Anhänger bei mehreren Dingen ein -s?
        hint: Schau noch einmal, wo der Anhänger hängt und ob er ein -s trägt.
      - type: language-task
        id: adjektive-uebersetzen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Das Haus ist neu.
            target: The house is new.
            mistakes:
              - answer: The house new.
                message: Nach dem Nomen kommt erst be. Dir fehlt is.
              - answer: The house are new.
                message: Zu house (ein Haus) gehört is, nicht are.
          - source: Peter hat ein großes Kaninchen.
            target: Peter has got a big rabbit.
            accepted: [Peter has a big rabbit., Peter's got a big rabbit.]
            mistakes:
              - answer: Peter has got a rabbit big.
                message: Der Anhänger hängt vor dem Nomen.
          - source: Die Bäume sind alt.
            target: The trees are old.
            mistakes:
              - answer: The trees is old.
                message: Zu trees (mehrere Bäume) gehört are.
              - answer: The trees are olds.
                message: Der Anhänger bekommt nie ein -s.
      - type: language-task
        id: adjektive-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: peter-has-got-a-small-rabbit.mp3
            target: Peter has got a small rabbit.
          - audio: ellie-has-got-a-new-jacket.mp3
            target: Ellie has got a new jacket.
          - audio: the-garden-is-big.mp3
            target: The garden is big.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: adjektive-nachsprechen
        language: en
        items:
          - audio: amir-has-got-a-small-hamster.mp3
            text: Amir has got a small hamster.
          - audio: the-trees-are-tall.mp3
            text: The trees are tall.
          - audio: mr-hill-has-got-a-big-garden.mp3
            text: Mr Hill has got a big garden.
        hint: Hör den Satz zuerst. Sprich dann langsam nach.
      - type: open-task
        id: adjektive-karte
        task: "Sophie schreibt zwei Karten für die Ausstellung. Schreibe zwei Sätze über ein Haus, einen Garten oder ein Tier: einen mit dem Anhänger vor dem Nomen und einen mit dem Anhänger nach is oder are."
        points:
          - text: Ein Satz hat den Adjektiv-Anhänger vor dem Nomen (zum Beispiel a big garden).
            source: /beschreiben-und-vergleichen/adjektive/#neu
          - text: Ein Satz hat den Adjektiv-Anhänger nach is oder are (zum Beispiel The garden is big.).
            source: /beschreiben-und-vergleichen/adjektive/#neu
          - text: Es sind ganze Sätze mit is, are oder has got und einem Punkt am Ende.
            kind: form
        solution: |
          Mr Hill has got a small house. The garden is big.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Die Karten hängen jetzt an den Fotos. Mr Hill zeigt auf zwei Bäume und fragt in die Klasse: „Welcher Baum ist größer?“ Auf der nächsten Seite lernst du, wie du das auf Englisch sagst."
