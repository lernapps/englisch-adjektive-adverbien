format: 2
strand: englisch/grammatik
title: "Beschreiben und vergleichen: Adjektive und Adverbien"
intro: In der Millbrook School bauen Sophie (11, aus Deutschland), Ellie (11), ihr Bruder Peter (9) und Amir (11) im Flur die Ausstellung „Our Millbrook“ auf. Ihr Englischlehrer Mr Hill gibt ihnen Anhänger zum Beschriften. Du lernst, mit Adjektiven zu beschreiben, sie zu steigern und zu vergleichen, und mit Adverbien zu sagen, wie jemand etwas tut.
languages: [de]
scope:
  text: Die App erklärt Kindern im ersten und zweiten Lernjahr Englisch, wie sie Personen, Dinge und Handlungen beschreiben und vergleichen. Blaue Adjektiv-Anhänger hängen am Nomen oder nach be, orange Adverb-Anhänger mit -ly hängen am Verb. Eine Treppe zeigt die Steigerung. Gelernt werden die Stellung der Adjektive, die Steigerung (-er/-est, more/most, good und bad), Vergleiche mit than und as … as, Adverbien der Art und Weise (auch well, fast, hard), die Frage Adjektiv oder Adverb und die Steigerung der Adverbien. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Häufigkeitsadverbien (steht im Explainer „Zeiten auf dem Zeitstrahl“)
    - Wörter zum Beschreiben von Personen als Wortschatz (steht im Explainer „Alltag“)
    - Adjektive nach Sinnesverben, Stellung der Adverbien im Satz und Gradadverbien (spätere Version)
    - Das Stützwort one und Adjektive ohne Nomen wie the rich (spätere Version)
chapters: [beschreiben-und-vergleichen, wie-jemand-etwas-tut, genauer-beschreiben, adjektive-ohne-nomen]
